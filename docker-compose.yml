version: '3.8'

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # O Portainer vai preencher estas variáveis (do Passo 3)
      DATABASE_URL: ${DATABASE_URL}
      GLPI_LOGIN: ${GLPI_LOGIN}
      GLPI_PASSWORD: ${GLPI_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD} 
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
    # A SECÇÃO 'env_file:' FOI REMOVIDA
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Frontend # (Com 'F' maiúsculo)
    restart: unless-stopped
    ports:
      - "8080:80" # (Porta 8080)
    depends_on:
      - backend

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password # (Auth fix)
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: "preventiva_db"
      MYSQL_USER: "techflow_user" 
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck: # (Healthcheck para esperar o DB)
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: