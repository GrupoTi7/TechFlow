version: '3.8'

services:
  backend:
    # Caminho correto (b minúsculo)
    build: ./backend
    restart: unless-stopped
    environment:
      # O Portainer vai preencher estas variáveis (do Passo 3)
      DATABASE_URL: ${DATABASE_URL}
      GLPI_LOGIN: ${GLPI_LOGIN}
      GLPI_PASSWORD: ${GLPI_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
    depends_on:
      - db

  frontend:
    # Caminho correto (F maiúsculo)
    build: ./Frontend 
    restart: unless-stopped
    ports:
      - "8080:80" # Usando a porta que sabemos que está livre
    depends_on:
      - backend

  db:
    image: mysql:8.0
    # Força o MySQL 8 a usar o plugin de senha antigo
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: "preventiva_db"
      MYSQL_USER: "techflow_user"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
