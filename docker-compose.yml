# docker-compose.yml (VERSÃO CORRIGIDA PARA O GIT)
version: '3.8'

services:
  backend:
    build: ./backend # <-- Correto (caminho relativo)
    restart: unless-stopped
    environment:
      # O Portainer vai injetar estas variáveis a partir da UI
      DATABASE_URL: ${DATABASE_URL}
      GLPI_LOGIN: ${GLPI_LOGIN}
      GLPI_PASSWORD: ${GLPI_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD} # Senha para o techflow_user
      # (E todas as suas variáveis de E-mail)
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
    # A secção 'env_file:' FOI REMOVIDA
    depends_on:
      - db

  frontend:
    build: ./frontend # <-- Correto (caminho relativo)
    restart: unless-stopped
    ports:
      - "80:80" 
    depends_on:
      - backend

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Senha do Admin do BD
      MYSQL_DATABASE: "preventiva_db"
      MYSQL_USER: "techflow_user"         # O utilizador da sua aplicação
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}      # A senha do utilizador da aplicação
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: