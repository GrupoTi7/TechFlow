# docker-compose.yml
version: '3.8'

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # URL de conexão ao banco (usando o nome do serviço "db" como host)
      DATABASE_URL: mysql://techflow_user:${123456db}@db:3306/preventiva_db
      
      GLPI_LOGIN: ${GLPI_LOGIN}
      GLPI_PASSWORD: ${GLPI_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
    depends_on:
      - db

  frontend:
    build: ./Frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: preventiva_db
      MYSQL_USER: techflow_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
