version: '3.8'

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # Diz ao Docker para ler o ficheiro .env
    env_file:
      - ./backend/.env 
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Frontend
    restart: unless-stopped
    ports:
      - "8080:80" 
    depends_on:
      - backend

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      # O DB lê as senhas do .env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: "preventiva_db"
      MYSQL_USER: "techflow_user" 
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    env_file:
      - ./backend/.env # O DB também lê o .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: