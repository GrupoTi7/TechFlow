version: '3.8'

services:
  # O seu backend (API) - O "Gatilho"
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL}
      GLPI_API_URL: ${GLPI_API_URL}
      GLPI_LOGIN: ${GLPI_LOGIN}
      GLPI_PASSWORD: ${GLPI_PASSWORD}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      USE_MOCK_DATA: ${USE_MOCK_DATA}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD} 
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
      AGIDESK_TENANT: ${AGIDESK_TENANT}
      AGIDESK_APP_KEY: ${AGIDESK_APP_KEY}
      AGIDESK_CUSTOMER_ID: ${AGIDESK_CUSTOMER_ID}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis: # <-- NOVO: O backend agora depende do Redis
        condition: service_started

  # O seu frontend (Nginx)
  frontend:
    build: ./Frontend
    restart: unless-stopped
    ports:
      - "8080:80" 
      - "443:443" #Porta HTTPS
    depends_on:
      - backend

  # O seu Banco de Dados (MySQL)
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: "preventiva_db"
      MYSQL_USER: "techflow_user" 
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # --- NOVO SERVIÇO: O BROKER DA FILA ---
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data: